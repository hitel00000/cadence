<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Deep dark to charcoal) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Accent Orange Gradient (Theme Primary Colors) -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Soft Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Premium rounded square container -->
  <rect width="180" height="180" rx="45" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="176" height="176" rx="43" stroke="#27272a" stroke-width="4"/>

  <!-- Cadence Corrected Eighth Note Logo -->
  <!-- Note Head (Rotated Ellipse) -->
  <ellipse cx="60" cy="120" rx="18" ry="13" transform="rotate(-25 60 120)" fill="url(#orange-grad)" filter="url(#glow)"/>
  
  <!-- Stem -->
  <path d="M75 120V45" stroke="url(#orange-grad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Corrected Classical Eighth Note Flag (Fill-based vector tail) -->
  <path d="M75 45C100 48 120 70 112 102C106 88 92 78 75 75Z" fill="url(#orange-grad)" filter="url(#glow)"/>
</svg>

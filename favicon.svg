<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Accent Orange Gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Premium rounded square background container -->
  <rect width="180" height="180" rx="45" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="176" height="176" rx="43" stroke="#27272a" stroke-width="4"/>

  <!-- Centered and Proportional Eighth Note (♪) -->
  <g filter="url(#glow)">
    <!-- Note Head (Rotated Ellipse) -->
    <ellipse cx="71" cy="123" rx="18" ry="13" transform="rotate(-25 71 123)" fill="url(#orange-grad)"/>
    
    <!-- Note Stem (Using rect with explicit fill instead of stroke-based path to guarantee rendering across all browsers) -->
    <rect x="81" y="48" width="10" height="75" rx="2" fill="url(#orange-grad)"/>
    
    <!-- Note Flag (Eighth note tail, starting flush from the stem's right edge at X=91) -->
    <path d="M91 48C112 52 130 70 124 98C118 84 105 78 91 76Z" fill="url(#orange-grad)"/>
  </g>
</svg>
